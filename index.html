<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0c0e14; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .match-card { background: #1a1c24; border-radius: 12px; padding: 16px 20px; border: 1px solid #2a2f3a; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .score-badge { font-size: 0.85rem; font-weight: 800; color: #d4ff00; }
        .team-link { font-size: 0.9rem; font-weight: 600; color: #f1f5f9; text-decoration: none; transition: 0.3s; }
        .team-link:hover { color: #d4ff00; }
        .nav-btn { background: #2a2f3a; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .active-nav { background: #d4ff00; color: #0c0e14; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-md mx-auto">
        <!-- Main Header -->
        <h1 class="text-xl font-black text-white tracking-widest uppercase mb-6 text-center">Master League | World Cup</h1>
        
        <!-- Navigation Bar -->
        <div class="flex justify-center gap-2 mb-8" id="nav-bar">
            <button class="nav-btn active-nav" onclick="showStage('quarter', this)">Quarter</button>
            <button class="nav-btn" onclick="showStage('semi', this)">Semi</button>
            <button class="nav-btn" onclick="showStage('final', this)">Final</button>
        </div>
        
        <h2 id="stage-title" class="text-sm font-bold text-gray-400 tracking-widest uppercase mb-4 text-center">QUARTER FINALS</h2>
        <div id="tournament-content" class="space-y-3"></div>
    </div>

    <script>
        const CONTACTS = {
            "Austria": "https://t.me/lord_voldemort101",
            "Croatia": "https://t.me/Saad_waiyan",
            "Japan": "https://t.me/LHA_goodluck",
            "New Zealand": "https://t.me/ikc8088",
            "Scotland": "https://t.me/kokyaw876",
            "United States": "https://t.me/ChanAung1178",
            "Panama": "",
            "Turkey": ""
        };

        const stages = {
            quarter: [
                { team1: "Austria", score1: 4, team2: "Croatia", score2: 7 },
                { team1: "Japan", score1: 2, team2: "New Zealand", score2: 14 },
                { team1: "Scotland", score1: 6, team2: "United States", score2: 7 },
                { team1: "Panama", score1: 6, team2: "Turkey", score2: 10 }
            ],
            semi: [
                { team1: "Croatia", score1: "3", team2: "New Zealand", score2: "4" },
                { team1: "United States", score1: "8", team2: "Turkey", score2: "7" }
            ],
            final: [
                { team1: "New Zealand", score1: "", team2: "United States", score2: "" }
            ]
        };

        function showStage(stage, btn) {
            const container = document.getElementById('tournament-content');
            const title = document.getElementById('stage-title');
            container.innerHTML = '';
            
            const titles = { quarter: 'QUARTER FINALS', semi: 'SEMI FINALS', final: 'GRAND FINAL' };
            title.innerText = titles[stage];
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-nav'));
            btn.classList.add('active-nav');

            stages[stage].forEach((match) => {
                const card = document.createElement('div');
                card.className = 'match-card';
                const createLink = (name) => CONTACTS[name] ? `<a href="${CONTACTS[name]}" target="_blank" class="team-link">${name}</a>` : `<span class="team-link">${name}</span>`;
                
                card.innerHTML = `
                    <div class="w-1/3 text-center truncate">${createLink(match.team1)}</div>
                    <div class="score-badge w-1/3 text-center">${match.score1} - ${match.score2}</div>
                    <div class="w-1/3 text-center truncate">${createLink(match.team2)}</div>
                `;
                container.appendChild(card);
            });
        }
        
        // Initial load
        showStage('quarter', document.querySelector('.nav-btn'));
    </script>
</body>
</html>
